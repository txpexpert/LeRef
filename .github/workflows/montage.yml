# Contrôle et chargement automatiques du contenu à chaque modification de content/
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Montage du contenu
on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:
jobs:
  montage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Contrôle et chargement
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run montage
      - name: Rapport de montage
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapports, path: rapports/*.md }
